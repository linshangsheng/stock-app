<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="林上升 &lt;linshangsheng1987@gmail.com&gt;">
<title>股票 · 趋势波段 — 启动中</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<!-- 启动画面：「启动股票.vbs」一双击就用 Edge 应用窗口打开本页（本地文件，不依赖后端），
     一边播放动画一边探测后端 /api/ping，后端就绪后淡出并跳到应用。参数：?url=后端地址（默认 http://127.0.0.1:8000/） -->
<style>
:root { --bg0: #04070f; --bg1: #0a1330; --gold: #ffd166; --gold2: #fff1c2; --red: #ff4d5e; --green: #22c98d; --ink: #eef1ff; --muted: #8f9bcc; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg0); color: var(--ink);
  font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui, sans-serif; user-select: none; }
#sky { position: fixed; inset: 0; background:
  radial-gradient(1200px 700px at 50% 38%, #142257 0%, #0a1230 45%, var(--bg0) 100%); }
.aurora { position: fixed; border-radius: 50%; filter: blur(90px); opacity: .55; mix-blend-mode: screen; will-change: transform; }
.a1 { width: 46vw; height: 46vw; left: -10vw; top: -14vw; background: radial-gradient(circle, #3b5bff 0%, transparent 65%); animation: drift1 16s ease-in-out infinite alternate; }
.a2 { width: 40vw; height: 40vw; right: -8vw; top: -6vw; background: radial-gradient(circle, #ff9f43 0%, transparent 62%); opacity: .38; animation: drift2 19s ease-in-out infinite alternate; }
.a3 { width: 52vw; height: 52vw; left: 26vw; bottom: -30vw; background: radial-gradient(circle, #e8344e 0%, transparent 60%); opacity: .30; animation: drift3 22s ease-in-out infinite alternate; }
@keyframes drift1 { to { transform: translate(14vw, 10vw) scale(1.15); } }
@keyframes drift2 { to { transform: translate(-12vw, 12vw) scale(.9); } }
@keyframes drift3 { to { transform: translate(-10vw, -8vw) scale(1.2); } }

/* 透视网格「地面」 */
.floor { position: fixed; left: -50%; right: -50%; bottom: -8vh; height: 38vh; perspective: 340px; perspective-origin: 50% 0%; pointer-events: none; }
.floor::before { content: ""; position: absolute; inset: 0; transform: rotateX(72deg); transform-origin: 50% 0%;
  background-image: linear-gradient(rgba(120,150,255,.22) 1px, transparent 1px), linear-gradient(90deg, rgba(120,150,255,.16) 1px, transparent 1px);
  background-size: 64px 64px; animation: run 1.6s linear infinite;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 35%, #000 100%); mask-image: linear-gradient(to bottom, transparent 0%, #000 35%, #000 100%); }
@keyframes run { to { background-position: 0 64px, 0 0; } }
.horizon { position: fixed; left: 0; right: 0; bottom: 30vh; height: 2px; background: linear-gradient(90deg, transparent, rgba(255,209,102,.55), transparent);
  box-shadow: 0 0 24px 6px rgba(255,170,60,.25); pointer-events: none; }

canvas#fx { position: fixed; inset: 0; width: 100%; height: 100%; }
.vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%); }

/* 中央 */
.hero { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding-bottom: 9vh;
  transition: transform .9s cubic-bezier(.2,.8,.2,1), opacity .8s ease, filter .8s ease; }
.logo-wrap { position: relative; width: 148px; height: 148px; animation: logoIn 1.3s cubic-bezier(.18,1.25,.4,1) both; }
.logo-wrap svg { position: relative; width: 100%; height: 100%; display: block; filter: drop-shadow(0 18px 40px rgba(255,170,60,.25)) drop-shadow(0 0 2px rgba(255,255,255,.3)); }
.ring { position: absolute; inset: -22px; border-radius: 50%;
  background: conic-gradient(from 0deg, transparent 0deg, rgba(255,209,102,.0) 40deg, rgba(255,209,102,.9) 110deg, rgba(255,77,94,.7) 170deg, transparent 230deg, transparent 360deg);
  -webkit-mask: radial-gradient(circle, transparent 64%, #000 65%, #000 68%, transparent 69%); mask: radial-gradient(circle, transparent 64%, #000 65%, #000 68%, transparent 69%);
  animation: spin 2.4s linear infinite; filter: blur(.4px) drop-shadow(0 0 8px rgba(255,200,80,.8)); }
.ring.r2 { inset: -36px; opacity: .45; animation-duration: 4.2s; animation-direction: reverse;
  background: conic-gradient(from 90deg, transparent 0deg, rgba(90,130,255,.9) 80deg, transparent 160deg, transparent 360deg); }
.pulse { position: absolute; inset: -8px; border-radius: 34px; box-shadow: 0 0 0 0 rgba(255,209,102,.5); animation: pulse 2.2s ease-out infinite 1.1s; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,209,102,.30); } 100% { box-shadow: 0 0 0 40px rgba(255,209,102,0); } }
@keyframes logoIn { 0% { opacity: 0; transform: perspective(600px) rotateY(-80deg) scale(.4); } 60% { opacity: 1; } 100% { opacity: 1; transform: none; } }

h1 { margin: 6px 0 0; font-size: 64px; letter-spacing: .14em; font-weight: 800; line-height: 1.1; padding-left: .14em;
  filter: drop-shadow(0 4px 22px rgba(255,170,60,.38)); }
h1 span { display: inline-block; opacity: 0; transform: translateY(26px) scale(.9);
  background: linear-gradient(100deg, #ffb627 0%, #ffe39a 30%, #ffffff 45%, #ffe39a 60%, #ffb627 100%); background-size: 400% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: rise .8s cubic-bezier(.2,.9,.2,1.2) forwards, shimmer 3.2s linear infinite; }
h1 span:nth-child(1) { animation-delay: .45s, 0s; background-position: 0% 0; } h1 span:nth-child(2) { animation-delay: .55s, .12s; }
h1 span:nth-child(3) { animation-delay: .65s, .24s; } h1 span:nth-child(4) { animation-delay: .75s, .36s; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -300% 0; } }
@keyframes rise { to { opacity: 1; transform: none; } }
.sub { font-size: 15px; letter-spacing: .32em; color: #a3aedb; opacity: 0; animation: fade 1s ease 1.05s forwards; text-indent: .32em; text-shadow: 0 2px 12px rgba(0,0,0,.9); }
.sub b { color: #cdd6ff; font-weight: 600; }
@keyframes fade { to { opacity: 1; } }

.ticker { width: min(760px, 86vw); overflow: hidden; margin-top: 8px; opacity: 0; animation: fade 1s ease 1.3s forwards;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); }
.ticker .track { display: inline-flex; gap: 12px; white-space: nowrap; animation: tick 22s linear infinite; }
.chip { font-size: 12px; padding: 5px 12px; border-radius: 999px; border: 1px solid rgba(160,180,255,.18); background: rgba(20,32,80,.45);
  color: #c9d3ff; letter-spacing: .06em; backdrop-filter: blur(4px); }
.chip i { font-style: normal; color: var(--gold); margin-right: 6px; }
@keyframes tick { to { transform: translateX(-50%); } }

/* 底部：进度 */
.boot { position: fixed; left: 50%; bottom: 8vh; transform: translateX(-50%); width: min(520px, 84vw); text-align: center; opacity: 0; animation: fade .8s ease .9s forwards; }
.bar { position: relative; height: 6px; border-radius: 6px; background: rgba(140,160,255,.14); overflow: hidden; box-shadow: inset 0 0 0 1px rgba(160,180,255,.10); }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; border-radius: 6px; transition: width .5s cubic-bezier(.3,.9,.3,1);
  background: linear-gradient(90deg, #ff4d5e, #ff9f43 45%, #ffd166 80%, #fff1c2); box-shadow: 0 0 14px 2px rgba(255,180,70,.55); }
.bar i::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.65), transparent); width: 40%; animation: sweep 1.3s ease-in-out infinite; }
@keyframes sweep { from { transform: translateX(-120%); } to { transform: translateX(260%); } }
.steps { display: flex; justify-content: space-between; margin-top: 12px; font-size: 12px; color: #6f7bab; letter-spacing: .05em; }
.steps span { display: inline-flex; align-items: center; gap: 6px; transition: color .4s; }
.steps span::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #2a3566; box-shadow: 0 0 0 2px rgba(160,180,255,.15); transition: all .4s; }
.steps span.on { color: #dfe5ff; } .steps span.on::before { background: var(--gold); box-shadow: 0 0 10px 2px rgba(255,209,102,.7); }
.steps span.done { color: #9fe8c6; } .steps span.done::before { background: var(--green); box-shadow: 0 0 8px 1px rgba(34,201,141,.6); }
.msg { margin-top: 10px; font-size: 13px; color: #b9c2ea; min-height: 18px; letter-spacing: .04em; text-shadow: 0 2px 10px rgba(0,0,0,.9); }
.msg em { font-style: normal; color: var(--gold); font-variant-numeric: tabular-nums; }
.foot { position: fixed; left: 0; right: 0; bottom: 2.6vh; text-align: center; font-size: 11px; color: #4f5a88; letter-spacing: .12em; opacity: 0; animation: fade 1s ease 1.6s forwards; }
.skip { position: fixed; right: 20px; top: 16px; font-size: 12px; color: #6f7bab; border: 1px solid rgba(160,180,255,.18); border-radius: 999px; padding: 5px 12px;
  background: rgba(10,16,40,.4); cursor: pointer; opacity: 0; transition: opacity .4s, color .2s; }
.skip.show { opacity: 1; } .skip:hover { color: #dfe5ff; }

.err { position: fixed; left: 50%; bottom: 7vh; transform: translateX(-50%); width: min(600px, 90vw); padding: 18px 20px; border-radius: 14px; display: none;
  background: rgba(40,10,20,.72); border: 1px solid rgba(255,77,94,.45); box-shadow: 0 10px 40px rgba(0,0,0,.5); font-size: 13px; line-height: 1.7; color: #ffd9de; }
.err b { color: #fff; } .err code { background: rgba(255,255,255,.08); padding: 1px 6px; border-radius: 4px; color: #ffe9a6; }
.err .row { margin-top: 10px; display: flex; gap: 10px; }
.err button { cursor: pointer; border: 0; border-radius: 8px; padding: 7px 14px; font: inherit; background: #ff4d5e; color: #fff; }
.err button.ghost { background: transparent; border: 1px solid rgba(255,255,255,.3); color: #ffd9de; }

/* 退场：画面推近、发光、淡出 */
body.leaving .hero { transform: scale(1.35); opacity: 0; filter: blur(6px) brightness(1.6); }
body.leaving .boot, body.leaving .foot, body.leaving .skip { opacity: 0 !important; transition: opacity .4s; }
.flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(circle at 50% 42%, rgba(255,235,180,.55), rgba(5,8,20,0) 60%); transition: opacity .5s ease; }
body.leaving .flash { opacity: 1; }
.curtain { position: fixed; inset: 0; background: var(--bg0); opacity: 0; pointer-events: none; transition: opacity .55s ease .35s; }
body.leaving .curtain { opacity: 1; }

@media (max-width: 640px) { h1 { font-size: 44px; } .logo-wrap { width: 112px; height: 112px; } .sub { font-size: 12px; letter-spacing: .2em; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  h1 span, .sub, .ticker, .boot, .foot { opacity: 1 !important; transform: none !important; }
}
</style>
</head>
<body>
<div id="sky"></div>
<div class="aurora a1"></div><div class="aurora a2"></div><div class="aurora a3"></div>
<div class="floor"></div><div class="horizon"></div>
<canvas id="fx"></canvas>
<div class="vignette"></div>

<div class="hero">
  <div class="logo-wrap">
    <div class="ring r2"></div><div class="ring"></div><div class="pulse"></div>
    <svg viewBox="0 0 512 512" aria-label="趋势波段">
      <defs>
        <linearGradient id="s-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22357f"/><stop offset=".5" stop-color="#121c4d"/><stop offset="1" stop-color="#070c22"/></linearGradient>
        <radialGradient id="s-halo" cx=".8" cy=".18" r=".62"><stop offset="0" stop-color="#ffc83d" stop-opacity=".42"/><stop offset=".45" stop-color="#ff8a3d" stop-opacity=".1"/><stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/></radialGradient>
        <linearGradient id="s-up" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7a7a"/><stop offset="1" stop-color="#d81f3a"/></linearGradient>
        <linearGradient id="s-dn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fe0a8"/><stop offset="1" stop-color="#0c9a6a"/></linearGradient>
        <linearGradient id="s-gold" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#ffb627"/><stop offset=".6" stop-color="#ffd76a"/><stop offset="1" stop-color="#fff4cf"/></linearGradient>
        <linearGradient id="s-gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".42" stop-color="#fff" stop-opacity="0"/></linearGradient>
        <filter id="s-blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="11"/></filter>
        <clipPath id="s-tile"><rect width="512" height="512" rx="116"/></clipPath>
      </defs>
      <g clip-path="url(#s-tile)">
        <rect width="512" height="512" fill="url(#s-bg)"/><rect width="512" height="512" fill="url(#s-halo)"/>
        <path d="M70 168H442M70 248H442M70 328H442M70 408H442" stroke="#a9bcff" stroke-opacity=".09" stroke-width="3"/>
        <g stroke-linecap="round" stroke-width="9">
          <path d="M148 290V418" stroke="#ff6b6b"/><rect x="123" y="312" width="50" height="86" rx="11" fill="url(#s-up)"/>
          <path d="M220 248V362" stroke="#2fd39a"/><rect x="195" y="266" width="50" height="72" rx="11" fill="url(#s-dn)"/>
          <path d="M292 186V326" stroke="#ff6b6b"/><rect x="267" y="208" width="50" height="98" rx="11" fill="url(#s-up)"/>
          <path d="M364 116V272" stroke="#ff6b6b"/><rect x="339" y="138" width="50" height="116" rx="11" fill="url(#s-up)"/>
        </g>
        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M88 380C146 366 162 300 212 306S262 298 288 262S350 170 404 124" stroke="#ffc83d" stroke-opacity=".55" stroke-width="34" filter="url(#s-blur)"/>
          <path class="trend" d="M88 380C146 366 162 300 212 306S262 298 288 262S350 170 404 124" stroke="url(#s-gold)" stroke-width="19"/>
        </g>
        <path class="arrow" d="M440 90L425 150L379 104Z" fill="#fff4cf" stroke="#fff4cf" stroke-width="8" stroke-linejoin="round"/>
        <rect width="512" height="512" fill="url(#s-gloss)"/>
      </g>
      <rect x="3" y="3" width="506" height="506" rx="113" fill="none" stroke="#fff" stroke-opacity=".10" stroke-width="6"/>
    </svg>
  </div>
  <h1><span>趋</span><span>势</span><span>波</span><span>段</span></h1>
  <div class="sub"><b>A股 · 美股</b>　宽基择时 · 低风险组合 · 波段纪律</div>
  <div class="ticker"><div class="track" id="track"></div></div>
</div>

<div class="boot" id="boot">
  <div class="bar"><i id="bar"></i></div>
  <div class="steps"><span id="s1" class="on">启动本地后端</span><span id="s2">连接数据</span><span id="s3">准备就绪</span></div>
  <div class="msg" id="msg">正在启动…</div>
</div>
<div class="err" id="err">
  <b>后端没有启动成功</b>（等了 <span id="waited">90</span> 秒）。可以这样排查：<br>
  1. 打开软件目录里的 <code>data\server.log</code>，看最后几行的报错；<br>
  2. 在软件目录打开命令行，运行 <code>python -m server.main</code>，看具体提示（缺依赖时按提示安装）；<br>
  3. 端口被占用：任务管理器结束所有 Python，再双击「Stock App」。
  <div class="row"><button id="retry">再等一会</button><button class="ghost" id="openanyway">直接打开</button></div>
</div>
<div class="skip" id="skip" title="Enter / 空格 / 点这里">跳过动画 ⏎</div>
<div class="foot">© 2026 林上升 · 本地运行 · 数据只在你的电脑上 · 规则输出，不构成投资建议</div>
<div class="flash"></div><div class="curtain"></div>

<script>
(() => {
  const qs = new URLSearchParams(location.search);
  const APP = (qs.get('url') || 'http://127.0.0.1:8000/').replace(/\/?$/, '/');
  const MIN_SHOW = 2600;              // 动画至少播放这么久（后端早就在运行时也能看完开场）
  const TIMEOUT = 90000;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const t0 = performance.now();
  const $ = id => document.getElementById(id);

  // ---- 指数名跑马灯（装饰：只有名字，不显示数字） ----
  const names = ['上证50', '沪深300', '中证500', '中证1000', '创业板指', '标普500', '纳斯达克100', '低风险组合', '宽基 ETF', '关键均线'];
  const chips = names.map(n => `<span class="chip"><i>▲</i>${n}</span>`).join('');
  $('track').innerHTML = chips + chips;

  // ---- 画布：K 线逐根生长 + 均线发光 + 上升的光点 ----
  const cv = $('fx'), g = cv.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  function resize() { DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; g.setTransform(DPR, 0, 0, DPR, 0, 0); }
  resize(); addEventListener('resize', resize);
  let seed = 20261010;
  const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
  const STEP = 22, BODY = 11;
  const candles = [];
  let px = 100;
  function addCandle() {
    const i = candles.length;
    const drift = 0.0035 + 0.022 * Math.sin(i / 7) + (rnd() - 0.47) * 0.03;      // 上升趋势 + 波段起伏
    const o = px, c = px * (1 + drift);
    const hi = Math.max(o, c) * (1 + rnd() * 0.012), lo = Math.min(o, c) * (1 - rnd() * 0.012);
    candles.push({ o, c, hi, lo });
    px = c;
  }
  for (let k = 0; k < 400; k++) addCandle();
  const parts = Array.from({ length: reduce ? 0 : 90 }, () => ({ x: rnd(), y: rnd(), r: 0.6 + rnd() * 1.9, v: 0.02 + rnd() * 0.06, h: rnd(), tw: rnd() * 6.28 }));
  function frame(now) {
    const t = (now - t0) / 1000;
    g.clearRect(0, 0, W, H);
    const visible = Math.ceil(W / STEP) + 2;
    const shown = reduce ? visible : Math.floor(t * 26);
    while (candles.length < shown + 5) addCandle();          // 等得久就一直往后画
    const first = Math.max(0, shown - visible + 1);
    const span = candles.slice(first, shown + 1);
    if (span.length > 1) {
      let lo = Infinity, hi = -Infinity;
      for (const k of span) { lo = Math.min(lo, k.lo); hi = Math.max(hi, k.hi); }
      const top = H * 0.56, bot = H * 0.93;
      const y = v => bot - (v - lo) / (hi - lo || 1) * (bot - top);
      const x0 = span.length < visible - 2 ? STEP : W - span.length * STEP;   // 先从左往右画满，再向左滚动
      g.globalAlpha = 0.30;
      span.forEach((k, j) => {
        const x = x0 + j * STEP;
        const grow = j === span.length - 1 ? Math.min(1, (t * 26) % 1 + 0.2) : 1;
        const up = k.c >= k.o;
        const col = up ? '#ff4d5e' : '#22c98d';
        g.strokeStyle = col; g.lineWidth = 1.4;
        g.beginPath(); g.moveTo(x, y(k.hi)); g.lineTo(x, y(k.lo)); g.stroke();
        const yo = y(k.o), yc = yo + (y(k.c) - yo) * grow;
        g.fillStyle = col;
        g.fillRect(x - BODY / 2, Math.min(yo, yc), BODY, Math.max(2, Math.abs(yc - yo)));
      });
      // 10 日均线：发光金线
      g.globalAlpha = 0.85;
      g.lineWidth = 2.4; g.strokeStyle = '#ffd166'; g.shadowColor = 'rgba(255,190,80,.9)'; g.shadowBlur = 14;
      g.beginPath();
      let started = false;
      span.forEach((k, j) => {
        const i0 = first + j;
        if (i0 < 9) return;
        let s = 0; for (let m = i0 - 9; m <= i0; m++) s += candles[m].c;
        const x = x0 + j * STEP, yy = y(s / 10);
        if (!started) { g.moveTo(x, yy); started = true; } else g.lineTo(x, yy);
      });
      g.stroke();
      g.shadowBlur = 0;
      // 最新价：发光的点 + 细竖线
      const last = span[span.length - 1], xs = x0 + (span.length - 1) * STEP, ys = y(last.c);
      g.globalAlpha = 0.25; g.strokeStyle = '#ffd166'; g.lineWidth = 1; g.setLineDash([3, 5]);
      g.beginPath(); g.moveTo(xs, top - 20); g.lineTo(xs, bot + 10); g.stroke(); g.setLineDash([]);
      const pr = 5 + 2.5 * Math.sin(t * 6);
      const rg = g.createRadialGradient(xs, ys, 0, xs, ys, pr * 4);
      rg.addColorStop(0, 'rgba(255,241,194,.95)'); rg.addColorStop(.35, 'rgba(255,190,80,.55)'); rg.addColorStop(1, 'rgba(255,190,80,0)');
      g.globalAlpha = 1; g.fillStyle = rg; g.beginPath(); g.arc(xs, ys, pr * 4, 0, 6.283); g.fill();
    }
    // 上升的光点
    for (const p of parts) {
      p.y -= p.v / 60; if (p.y < -0.05) { p.y = 1.05; p.x = rnd(); }
      const a = 0.35 + 0.35 * Math.sin(t * 2.2 + p.tw);
      g.globalAlpha = a;
      g.fillStyle = p.h < 0.55 ? '#ffd166' : p.h < 0.8 ? '#ff6b6b' : '#7aa2ff';
      g.beginPath(); g.arc(p.x * W, p.y * H, p.r, 0, 6.283); g.fill();
    }
    g.globalAlpha = 1;
    if (!leaving || now - leaveAt < 1400) requestAnimationFrame(frame);
  }
  let leaving = false, leaveAt = 0;
  requestAnimationFrame(frame);

  // ---- 后端探测：本页是本地文件，用 no-cors 请求，只看「连得上」 ----
  const bar = $('bar'), msg = $('msg');
  let pct = 4, ready = false, done = false;
  const setStep = n => ['s1', 's2', 's3'].forEach((id, k) => { const e = $(id); e.className = k < n ? 'done' : k === n ? 'on' : ''; });
  const tickTimer = setInterval(() => {                 // 等待时进度条缓慢逼近 70%，让人知道没卡住
    if (ready) return;
    pct += (70 - pct) * 0.04;
    bar.style.width = pct.toFixed(1) + '%';
    const s = Math.round((performance.now() - t0) / 1000);
    msg.innerHTML = s < 3 ? '正在启动本地后端…' : `正在启动本地后端… <em>${s}</em> 秒（首次启动约 5~15 秒）`;
  }, 200);
  async function ping() {
    const ac = new AbortController(); const to = setTimeout(() => ac.abort(), 1500);
    try { await fetch(APP + 'api/ping?t=' + Date.now(), { mode: 'no-cors', cache: 'no-store', signal: ac.signal }); return true; }
    catch { return false; } finally { clearTimeout(to); }
  }
  let deadline = t0 + TIMEOUT;
  async function loop() {
    while (!ready) {
      if (await ping()) { ready = true; break; }
      if (performance.now() > deadline) { fail(); return; }
      await new Promise(r => setTimeout(r, 500));
    }
    setStep(1); pct = Math.max(pct, 78); bar.style.width = pct + '%'; msg.textContent = '已连接，正在载入行情与界面…';
    await new Promise(r => setTimeout(r, 450));
    setStep(2); bar.style.width = '100%'; msg.textContent = '准备就绪';
    const wait = Math.max(0, MIN_SHOW - (performance.now() - t0));
    setTimeout(go, reduce ? 0 : wait + 350);
  }
  function go() {
    if (done) return; done = true;
    clearInterval(tickTimer);
    leaving = true; leaveAt = performance.now();
    document.body.classList.add('leaving');
    setTimeout(() => location.replace(APP + '?splash=1'), reduce ? 0 : 900);
  }
  function fail() {
    clearInterval(tickTimer);
    $('boot').style.display = 'none';
    $('waited').textContent = Math.round((performance.now() - t0) / 1000);
    $('err').style.display = 'block';
  }
  $('retry').onclick = () => { $('err').style.display = 'none'; $('boot').style.display = ''; deadline = performance.now() + 60000; ready = false; loop(); };
  $('openanyway').onclick = () => location.replace(APP);
  const skip = () => { if (ready) go(); };
  $('skip').onclick = skip;
  addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape') skip(); });
  setTimeout(() => $('skip').classList.add('show'), 1200);
  loop();
})();
</script>
</body>
</html>
