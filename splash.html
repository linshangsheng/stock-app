<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="林上升 &lt;linshangsheng1987@gmail.com&gt;">
<title>股票 · 趋势波段 — 启动中</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<!-- 启动画面：「启动股票.vbs」一双击就用 Edge 应用窗口打开本页（本地文件，不依赖后端），
     一边播放开场一边探测后端，后端就绪后直接跳到应用。参数：?url=后端地址（默认 http://127.0.0.1:8000/）&alt=备用端口（逗号分隔）。
     探测用后端的 favicon.svg 当「指纹」：能当图片加载出来的才是本软件（8000 被 Windows 保留时后端会自动改用备用端口）。
     调试：加 ?freeze=1.4 会只画动画第 1.4 秒的静止画面，不探测后端、不跳转。

     开场（约 3 秒，一个镜头，由脚本按时间逐帧画，不是一堆各自循环的动画）：
       0.3s  极近的特写：一束金光沿着趋势线一笔画出，K 线随光点经过依次长起来
       1.4s  光点到达终点，箭头点亮
       1.5s  镜头拉远，图标的底板在拉远的过程中浮现，背景里淡淡的行情轮廓随之退去
       2.5s  名字淡入，一道光扫过图标
     最后一帧（图标 120px + 名字 28px，居中）与 index.html 的 #boot 完全一致，跳转时看不出换了页面。 -->
<style>
:root { --ink: #f5f6fa; --muted: #8e97bd; --gold: #ffd166; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; color: var(--ink); user-select: none;
  font-family: "SF Pro Display", "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui, sans-serif; }
body { background: radial-gradient(900px 560px at 50% 42%, #16245a 0%, #0b1332 55%, #060a1c 100%); }

/* 背景：淡淡的行情轮廓（装饰，开场时浮现、结尾退去） */
#sky { position: fixed; left: 0; right: 0; bottom: 0; width: 100%; height: 52vh; opacity: 0; pointer-events: none;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 55%); mask-image: linear-gradient(to bottom, transparent 0%, #000 55%); }
#sky rect { shape-rendering: crispEdges; }

/* 主角：图标 + 名字（居中，位置与 index.html 的 #boot 一致） */
.hero { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; }
.logo { position: relative; width: 120px; height: 120px; will-change: transform; }
.logo .shadow { position: absolute; inset: 0; border-radius: 27.2px; opacity: 0; box-shadow: 0 14px 34px rgba(0,0,0,.45), 0 0 48px rgba(255,190,80,.14); }
.logo svg { position: relative; width: 100%; height: 100%; display: block; overflow: visible; }
.k { transform-box: fill-box; transform-origin: 50% 100%; opacity: 0; }
.arrow { transform-box: fill-box; transform-origin: 50% 50%; opacity: 0; }
h1 { margin: 0; height: 36px; line-height: 36px; font-size: 28px; font-weight: 600; letter-spacing: .24em; padding-left: .24em; color: var(--ink); opacity: 0; }

/* 底部：一条细线 + 一行小字（线是「正在启动」，不是进度百分比——后端启动多久没法预知） */
.boot { position: fixed; left: 50%; bottom: 13vh; transform: translateX(-50%); width: 132px; text-align: center; opacity: 0; }
.bar { position: relative; height: 2px; border-radius: 2px; background: rgba(255,255,255,.12); overflow: hidden; }
.bar i { position: absolute; top: 0; bottom: 0; left: 0; width: 42%; border-radius: 2px; background: linear-gradient(90deg, transparent, var(--gold), transparent); animation: slide 1.5s ease-in-out infinite; }
.bar.full i { animation: none; left: 0; width: 100%; background: var(--gold); transition: width .35s ease; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(240%); } }
.msg { margin: 14px -120px 0; font-size: 12px; color: var(--muted); letter-spacing: .06em; min-height: 18px; white-space: nowrap; text-align: center; }     /* 左右留出空位：文字比线宽时仍然居中 */
body.leaving .boot { opacity: 0 !important; transition: opacity .25s; }

.err { position: fixed; left: 50%; bottom: 7vh; transform: translateX(-50%); width: min(600px, 90vw); padding: 18px 20px; border-radius: 14px; display: none;
  background: rgba(30,12,24,.78); border: 1px solid rgba(255,107,154,.4); box-shadow: 0 10px 40px rgba(0,0,0,.5); font-size: 13px; line-height: 1.7; color: #ffdde6; }
.err b { color: #fff; } .err code { background: rgba(255,255,255,.08); padding: 1px 6px; border-radius: 4px; color: #ffe9a6; }
.err .row { margin-top: 10px; display: flex; gap: 10px; }
.err button { cursor: pointer; border: 0; border-radius: 8px; padding: 7px 14px; font: inherit; background: #ff6b9a; color: #1a0a12; font-weight: 600; }
.err button.ghost { background: transparent; border: 1px solid rgba(255,255,255,.3); color: #ffdde6; font-weight: 400; }

@media (max-width: 640px) { .logo { width: 104px; height: 104px; } .logo .shadow { border-radius: 23.6px; } h1 { font-size: 24px; } }
</style>
</head>
<body>
<svg id="sky" viewBox="0 0 200 60" preserveAspectRatio="none" aria-hidden="true"></svg>

<div class="hero">
  <div class="logo" id="logo">
    <div class="shadow" id="shadow"></div>
    <svg viewBox="0 0 512 512" aria-label="趋势波段">
      <defs>
        <linearGradient id="s-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22357f"/><stop offset=".5" stop-color="#121c4d"/><stop offset="1" stop-color="#070c22"/></linearGradient>
        <radialGradient id="s-halo" cx=".8" cy=".18" r=".62"><stop offset="0" stop-color="#ffc83d" stop-opacity=".42"/><stop offset=".45" stop-color="#ff8a3d" stop-opacity=".1"/><stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/></radialGradient>
        <linearGradient id="s-up" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7a7a"/><stop offset="1" stop-color="#d81f3a"/></linearGradient>
        <linearGradient id="s-dn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fe0a8"/><stop offset="1" stop-color="#0c9a6a"/></linearGradient>
        <linearGradient id="s-gold" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#ffb627"/><stop offset=".6" stop-color="#ffd76a"/><stop offset="1" stop-color="#fff4cf"/></linearGradient>
        <linearGradient id="s-gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".42" stop-color="#fff" stop-opacity="0"/></linearGradient>
        <linearGradient id="s-shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".30"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
        <radialGradient id="s-head" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff8dc" stop-opacity=".95"/><stop offset=".25" stop-color="#ffd166" stop-opacity=".6"/><stop offset="1" stop-color="#ffb627" stop-opacity="0"/></radialGradient>
        <filter id="s-blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="11"/></filter>
        <clipPath id="s-tile"><rect width="512" height="512" rx="116"/></clipPath>
      </defs>
      <g clip-path="url(#s-tile)">
        <g id="tileBg" opacity="0">
          <rect width="512" height="512" fill="url(#s-bg)"/><rect width="512" height="512" fill="url(#s-halo)"/>
          <path d="M70 168H442M70 248H442M70 328H442M70 408H442" stroke="#a9bcff" stroke-opacity=".09" stroke-width="3"/>
        </g>
        <g stroke-linecap="round" stroke-width="9">
          <g class="k" data-x="148"><path d="M148 290V418" stroke="#ff6b6b"/><rect x="123" y="312" width="50" height="86" rx="11" fill="url(#s-up)"/></g>
          <g class="k" data-x="220"><path d="M220 248V362" stroke="#2fd39a"/><rect x="195" y="266" width="50" height="72" rx="11" fill="url(#s-dn)"/></g>
          <g class="k" data-x="292"><path d="M292 186V326" stroke="#ff6b6b"/><rect x="267" y="208" width="50" height="98" rx="11" fill="url(#s-up)"/></g>
          <g class="k" data-x="364"><path d="M364 116V272" stroke="#ff6b6b"/><rect x="339" y="138" width="50" height="116" rx="11" fill="url(#s-up)"/></g>
        </g>
        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path id="glow" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" d="M88 380C146 366 162 300 212 306S262 298 288 262S350 170 404 124" stroke="#ffc83d" stroke-opacity=".55" stroke-width="34" filter="url(#s-blur)"/>
          <path id="trend" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" d="M88 380C146 366 162 300 212 306S262 298 288 262S350 170 404 124" stroke="url(#s-gold)" stroke-width="19"/>
        </g>
        <g id="head" opacity="0"><circle r="58" fill="url(#s-head)"/><circle r="9" fill="#fffbe8"/></g>
        <path id="arrow" class="arrow" d="M440 90L425 150L379 104Z" fill="#fff4cf" stroke="#fff4cf" stroke-width="8" stroke-linejoin="round"/>
        <g id="tileTop" opacity="0"><rect width="512" height="512" fill="url(#s-gloss)"/></g>
        <rect id="shine" x="-260" y="-80" width="170" height="720" fill="url(#s-shine)" transform="skewX(-18)" opacity="0"/>
      </g>
      <rect id="rim" x="3" y="3" width="506" height="506" rx="113" fill="none" stroke="#fff" stroke-opacity=".10" stroke-width="6" opacity="0"/>
    </svg>
  </div>
  <h1 id="title">趋势波段</h1>
</div>

<div class="boot" id="boot">
  <div class="bar" id="bar"><i></i></div>
  <div class="msg" id="msg">正在启动</div>
</div>
<div class="err" id="err">
  <b>后端没有启动成功</b>（等了 <span id="waited">90</span> 秒）。可以这样排查：<br>
  1. 新电脑第一次用：先双击软件目录里的「<b>安装.bat</b>」安装运行所需的组件（只需要一次），装完再打开；<br>
  2. 打开软件目录里的 <code>data\server.log</code>，看最后几行的报错（缺组件时会写明缺哪个、怎么装）；<br>
  3. 在软件目录打开命令行，运行 <code>python -m server.main</code>，看具体提示；<br>
  4. 端口问题：任务管理器结束所有 Python，再双击「Stock App」；日志里有 <code>WinError 10013</code> 的话，见使用手册「安装时的常见问题」。
  <div class="row"><button id="retry">再等一会</button><button class="ghost" id="openanyway">直接打开</button></div>
</div>

<script>
(() => {
  const qs = new URLSearchParams(location.search);
  const APP = (qs.get('url') || 'http://127.0.0.1:8000/').replace(/\/?$/, '/');
  const ALT = (qs.get('alt') || '').split(',').map(x => x.trim()).filter(Boolean)
    .map(x => (/^\d+$/.test(x) ? `http://127.0.0.1:${x}/` : x.replace(/\/?$/, '/')));
  const CANDS = [APP, ...ALT.filter(u => u !== APP)];
  let TARGET = APP;
  const END = 3.0;                    // 开场一共这么多秒（后端早就在运行时也让它播完，再跳走）
  const TIMEOUT = 90000;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const t0 = performance.now();
  const $ = id => document.getElementById(id);
  const bar = $('bar'), msg = $('msg');
  let ready = false, done = false;

  // ================= 开场：一个镜头，按时间逐帧画 =================
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const lerp = (a, b, k) => a + (b - a) * k;
  const eo3 = x => 1 - Math.pow(1 - x, 3);
  const eio2 = x => (x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);
  const eoBack = x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
  function bezier(x1, y1, x2, y2) {                                   // 同 CSS 的 cubic-bezier
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const X = s => ((ax * s + bx) * s + cx) * s, Y = s => ((ay * s + by) * s + cy) * s;
    return x => { let lo = 0, hi = 1, s = x; for (let i = 0; i < 24; i++) { const v = X(s); if (Math.abs(v - x) < 1e-5) break; if (v < x) lo = s; else hi = s; s = (lo + hi) / 2; } return Y(s); };
  }
  const cam = bezier(.55, 0, .12, 1);                                 // 拉远：起步稳，收尾很软

  const logo = $('logo'), shadow = $('shadow'), tileBg = $('tileBg'), tileTop = $('tileTop'), rim = $('rim'), shine = $('shine');
  const trend = $('trend'), glow = $('glow'), head = $('head'), arrow = $('arrow'), title = $('title'), boot = $('boot'), sky = $('sky');
  const ks = [...document.querySelectorAll('.k')].map(el => ({ el, x: +el.dataset.x, reach: 0 }));
  const L = trend.getTotalLength();
  const T_DRAW0 = .3, T_DRAW1 = 1.4;
  const drawP = t => eio2(seg(t, T_DRAW0, T_DRAW1));
  for (const k of ks) {                                               // 光点走到每根 K 线的位置才让它长出来
    k.reach = T_DRAW1;
    for (let t = T_DRAW0; t <= T_DRAW1; t += .005) { if (trend.getPointAtLength(drawP(t) * L).x >= k.x - 36) { k.reach = t; break; } }
  }

  // 背景行情轮廓：一排淡淡的 K 线，整体向上，开场时浮现、结尾退去
  (function buildSky() {
    let seed = 20261102, px = 12; const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296; let out = '';
    for (let i = 0; i < 64; i++) {
      const o = px, c = px + (rnd() - .36) * 2.2 + .32; px = Math.max(5, Math.min(44, c));
      const up = c >= o, hi = Math.max(o, c) + rnd() * 1.6, lo = Math.min(o, c) - rnd() * 1.6, x = 1.5 + i * 3.08, col = up ? '#ff5a6a' : '#27d39a';
      out += `<rect x="${(x + 1.15).toFixed(2)}" y="${(60 - hi * 1.15).toFixed(2)}" width=".26" height="${((hi - lo) * 1.15).toFixed(2)}" fill="${col}"/>` +
             `<rect x="${x.toFixed(2)}" y="${(60 - Math.max(o, c) * 1.15).toFixed(2)}" width="2.56" height="${Math.max(.5, Math.abs(c - o) * 1.15).toFixed(2)}" fill="${col}"/>`;
    }
    sky.innerHTML = out;
  })();

  function render(t) {
    // 1) 一笔画出趋势线 + 光点
    const p = drawP(t);
    trend.style.strokeDashoffset = glow.style.strokeDashoffset = String(1 - p);
    const pt = trend.getPointAtLength(p * L);
    head.setAttribute('transform', `translate(${pt.x.toFixed(1)} ${pt.y.toFixed(1)})`);
    head.style.opacity = String(seg(t, .3, .5) * (1 - seg(t, 1.4, 1.85)));
    // 2) K 线随光点依次长出
    for (const k of ks) { const v = eo3(seg(t, k.reach, k.reach + .5)); k.el.style.opacity = String(clamp(v * 2)); k.el.style.transform = `scaleY(${(.15 + .85 * v).toFixed(3)})`; }
    // 3) 箭头点亮
    const a = seg(t, 1.38, 1.88);
    arrow.style.opacity = String(clamp(a * 3)); arrow.style.transform = `scale(${(.4 + .6 * eoBack(a)).toFixed(3)})`;
    // 4) 镜头：先缓缓推近一点点，再拉远到图标的真实大小
    const s = t < 1.5 ? lerp(5.2, 4.7, eo3(seg(t, 0, 1.5))) : lerp(4.7, 1, cam(seg(t, 1.5, 2.65)));
    logo.style.transform = `scale(${s.toFixed(4)})`;
    // 5) 底板在拉远的过程中浮现；一道光扫过
    const tile = eo3(seg(t, 1.6, 2.4));
    tileBg.style.opacity = tileTop.style.opacity = String(tile); rim.style.opacity = String(tile); shadow.style.opacity = String(tile);
    const sh = seg(t, 2.5, 3.0);
    shine.style.opacity = String(sh > 0 && sh < 1 ? Math.sin(sh * Math.PI) : 0);
    shine.setAttribute('transform', `translate(${lerp(0, 900, eio2(sh)).toFixed(1)} 0) skewX(-18)`);
    // 6) 名字淡入（字距微微收紧）
    const ti = eo3(seg(t, 2.35, 2.95)), ls = lerp(.36, .24, ti);
    title.style.opacity = String(ti); title.style.letterSpacing = ls.toFixed(3) + 'em'; title.style.paddingLeft = ls.toFixed(3) + 'em';
    title.style.transform = `translateY(${((1 - ti) * 8).toFixed(2)}px)`;
    // 7) 背景行情轮廓：浮现 → 退去；底部的线最后出现
    sky.style.opacity = String(.16 * seg(t, .1, 1.0) * (1 - seg(t, 2.1, 2.9)));
    sky.style.transform = `translateX(${(-t * .5).toFixed(2)}%)`;
    boot.style.opacity = String(seg(t, 2.6, 3.0));
  }

  // ================= 启动流程 =================
  const tickTimer = setInterval(() => {                  // 等得久了才提示秒数，让人知道没卡住
    if (ready) return;
    const s = Math.round((performance.now() - t0) / 1000);
    msg.textContent = s < 5 ? '正在启动' : `正在启动 · ${s} 秒（首次约 5~15 秒）`;
  }, 500);
  function probe(base) {                                 // 本页是本地文件，读不到后端的响应内容：用后端的 favicon.svg 当图片加载，加载成功 = 本软件已就绪
    return new Promise(res => {
      const img = new Image();
      const to = setTimeout(() => { img.onload = img.onerror = null; res(false); }, 1500);
      img.onload = () => { clearTimeout(to); res(true); };
      img.onerror = () => { clearTimeout(to); res(false); };
      img.src = base + 'favicon.svg?t=' + Date.now();
    });
  }
  async function ping() {
    const ok = await Promise.all(CANDS.map(probe));
    const k = ok.indexOf(true);
    if (k >= 0) { TARGET = CANDS[k]; return true; }
    return false;
  }
  let deadline = t0 + TIMEOUT;
  async function loop() {
    while (!ready) {
      if (await ping()) { ready = true; break; }
      if (performance.now() > deadline) { fail(); return; }
      await new Promise(r => setTimeout(r, 500));
    }
    bar.classList.add('full'); msg.textContent = '已就绪';
    const wait = Math.max(0, END * 1000 - (performance.now() - t0));
    setTimeout(go, reduce ? 0 : wait + 120);
  }
  function go() {
    if (done) return; done = true;
    clearInterval(tickTimer);
    document.body.classList.add('leaving');             // 只收起底部的线和字；图标和名字原地不动，index.html 的 #boot 接着显示同样的画面
    setTimeout(() => location.replace(TARGET + '?splash=1'), reduce ? 0 : 260);
  }
  function fail() {
    clearInterval(tickTimer);
    $('boot').style.display = 'none';
    $('waited').textContent = Math.round((performance.now() - t0) / 1000);
    $('err').style.display = 'block';
  }
  $('retry').onclick = () => { $('err').style.display = 'none'; $('boot').style.display = ''; deadline = performance.now() + 60000; ready = false; loop(); };
  $('openanyway').onclick = () => location.replace(TARGET);
  addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ' || e.key === 'Escape') && ready) go(); });     // 后端就绪后，按 Enter / 空格直接进入

  if (qs.has('freeze')) { render(parseFloat(qs.get('freeze')) || 0); clearInterval(tickTimer); return; }       // 调试：只画某一刻的静止画面
  if (reduce) render(END);                                                                                     // 系统设置了「减少动态效果」：直接显示最终画面
  else { const play = now => { const t = (now - t0) / 1000; render(Math.min(t, END)); if (t < END) requestAnimationFrame(play); }; requestAnimationFrame(play); }
  loop();
})();
</script>
</body>
</html>
