<!DOCTYPE html>
<html lang="zh-CN" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">          <!-- 中文软件，不需要浏览器的「要不要翻译」提示 -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="林上升 &lt;linshangsheng1987@gmail.com&gt;">
<title>顺势 — 启动中</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<!-- 启动画面：「启动股票.vbs」一双击就用 Edge 应用窗口打开本页（本地文件，不依赖后端），
     一边播放开场一边探测后端，后端就绪后直接跳到应用。参数：?url=后端地址（默认 http://127.0.0.1:8000/）&alt=备用端口（逗号分隔）。
     探测用后端的 favicon.svg 当「指纹」：能当图片加载出来的才是本软件（8000 被 Windows 保留时后端会自动改用备用端口）。
     调试：加 ?freeze=1.4 只画动画第 1.4 秒的静止画面（加载区显示「等了 7 秒」的样子），不探测后端、不跳转。

     设计：图标是一条「更高的高点、更高的低点」的上升波段线。开场很克制——底板浮现，波段线被一束光画出来，名字淡入；
     加载区也是同一条波段线：光点沿着它往前走，走到终点就是启动完成（进度是估计值，状态文字是真实的）。
     最后一帧与 index.html 的 #boot 完全一致（图标 / 名字 / 底色 / 位置），跳转时看不出换了页面。 -->
<style>
:root { --ink: #f1eee6; --muted: #7d84a8; --icon: 144px; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; color: var(--ink); user-select: none;
  font-family: "SF Pro Display", "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui, sans-serif; }
body { background: radial-gradient(900px 600px at 50% 38%, #1a1d33 0%, #0d0f1d 55%, #07080f 100%); }
body::before { content: ""; position: fixed; inset: 0; pointer-events: none;                       /* 两处极淡的氛围光：右下琥珀、左上靛蓝 */
  background: radial-gradient(700px 420px at 80% 94%, rgba(255,160,60,.07), transparent 70%), radial-gradient(600px 400px at 10% 6%, rgba(90,110,255,.06), transparent 70%); }

/* 主角：图标 + 名字（居中，位置与 index.html 的 #boot 一致） */
.hero { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; }
.logo { position: relative; width: var(--icon); height: var(--icon); opacity: 0; }
.logo .shadow { position: absolute; inset: 0; border-radius: calc(var(--icon) * .2266); box-shadow: 0 18px 44px rgba(0,0,0,.5), 0 0 60px rgba(255,177,59,.10); }
.logo svg { position: relative; width: 100%; height: 100%; display: block; overflow: visible; }
.word { height: 56px; text-align: center; }
h1 { margin: 0; height: 34px; line-height: 34px; font-size: 26px; font-weight: 500; letter-spacing: .34em; padding-left: .34em; color: var(--ink); opacity: 0; }
.sub { margin-top: 8px; height: 14px; line-height: 14px; font-size: 10.5px; letter-spacing: .5em; padding-left: .5em; color: var(--muted); opacity: 0; }

/* 加载区：同一条波段线，光点沿着它走；紧贴名字下方（不影响图标和名字的居中位置） */
.boot { position: fixed; left: 50%; top: calc(50% + (var(--icon) + 26px + 56px) / 2 + 46px); transform: translateX(-50%); width: 240px; opacity: 0; }
.boot svg { display: block; width: 240px; height: 44px; overflow: visible; }
.msg { margin: 14px -90px 0; font-size: 12px; color: var(--muted); letter-spacing: .08em; min-height: 18px; text-align: center; white-space: nowrap; }     /* 左右留出空位：文字比线宽时仍然居中 */
.msg em { font-style: normal; color: #ffc86b; font-variant-numeric: tabular-nums; }
body.leaving .boot { opacity: 0 !important; transition: opacity .25s; }

.err { position: fixed; left: 50%; bottom: 7vh; transform: translateX(-50%); width: min(600px, 90vw); padding: 18px 20px; border-radius: 14px; display: none;
  background: rgba(30,12,24,.78); border: 1px solid rgba(255,107,154,.4); box-shadow: 0 10px 40px rgba(0,0,0,.5); font-size: 13px; line-height: 1.7; color: #ffdde6; }
.err b { color: #fff; } .err code { background: rgba(255,255,255,.08); padding: 1px 6px; border-radius: 4px; color: #ffe9a6; }
.err .row { margin-top: 10px; display: flex; gap: 10px; }
.err button { cursor: pointer; border: 0; border-radius: 8px; padding: 7px 14px; font: inherit; background: #ff6b9a; color: #1a0a12; font-weight: 600; }
.err button.ghost { background: transparent; border: 1px solid rgba(255,255,255,.3); color: #ffdde6; font-weight: 400; }

@media (max-width: 640px) { :root { --icon: 112px; } h1 { font-size: 22px; } }
</style>
</head>
<body>
<div class="hero">
  <div class="logo" id="logo">
    <div class="shadow"></div>
    <svg viewBox="0 0 512 512" aria-label="顺势">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2=".9" y2="1"><stop offset="0" stop-color="#242a4d"/><stop offset=".55" stop-color="#12152b"/><stop offset="1" stop-color="#090b17"/></linearGradient>
        <radialGradient id="warm" cx=".82" cy=".2" r=".62"><stop offset="0" stop-color="#ffb13b" stop-opacity=".30"/><stop offset="1" stop-color="#ffb13b" stop-opacity="0"/></radialGradient>
        <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="92" y1="378" x2="428" y2="142"><stop offset="0" stop-color="#ff5a4a"/><stop offset=".5" stop-color="#ffb13b"/><stop offset="1" stop-color="#fff0c4"/></linearGradient>
        <radialGradient id="head"><stop offset="0" stop-color="#fff8dc" stop-opacity=".9"/><stop offset=".3" stop-color="#ffd166" stop-opacity=".5"/><stop offset="1" stop-color="#ffb13b" stop-opacity="0"/></radialGradient>
        <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".09"/><stop offset=".4" stop-color="#fff" stop-opacity="0"/></linearGradient>
        <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="13"/></filter>
        <clipPath id="tile"><rect width="512" height="512" rx="116"/></clipPath>
      </defs>
      <g clip-path="url(#tile)">
        <rect width="512" height="512" fill="url(#bg)"/><rect width="512" height="512" fill="url(#warm)"/>
        <path id="ghost" d="M92 412C190 402 272 332 428 208" fill="none" stroke="#fff" stroke-opacity=".2" stroke-width="12" stroke-linecap="round" opacity="0"/>
        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path id="glow" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" d="M92 378C140 378 156 262 212 262C262 262 268 330 312 330C366 330 372 142 428 142" stroke="#ffb13b" stroke-opacity=".55" stroke-width="40" filter="url(#blur)"/>
          <path id="trend" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" d="M92 378C140 378 156 262 212 262C262 262 268 330 312 330C366 330 372 142 428 142" stroke="url(#line)" stroke-width="26"/>
          <path id="pulse" pathLength="1" stroke-dasharray=".14 2" stroke-dashoffset=".14" opacity="0" d="M92 378C140 378 156 262 212 262C262 262 268 330 312 330C366 330 372 142 428 142" stroke="#fff6dc" stroke-opacity=".75" stroke-width="14"/>
        </g>
        <g id="head" opacity="0"><circle r="46" fill="url(#head)"/><circle r="15" fill="#fff6dc"/></g>
        <rect width="512" height="512" fill="url(#sheen)"/>
      </g>
      <rect x="3" y="3" width="506" height="506" rx="113" fill="none" stroke="#fff" stroke-opacity=".10" stroke-width="6"/>
    </svg>
  </div>
  <div class="word"><h1 id="title">顺势</h1><div class="sub" id="sub">TREND · SWING</div></div>
</div>

<div class="boot" id="boot">
  <svg viewBox="0 0 240 44" aria-hidden="true">
    <defs>
      <linearGradient id="ld-g" gradientUnits="userSpaceOnUse" x1="2" y1="0" x2="238" y2="0"><stop offset="0" stop-color="#ff5a4a"/><stop offset=".55" stop-color="#ffb13b"/><stop offset="1" stop-color="#fff0c4"/></linearGradient>
      <radialGradient id="ld-head"><stop offset="0" stop-color="#fff8dc" stop-opacity=".9"/><stop offset=".35" stop-color="#ffd166" stop-opacity=".45"/><stop offset="1" stop-color="#ffb13b" stop-opacity="0"/></radialGradient>
    </defs>
    <path d="M2 38C22 38 40 22 62 22C84 22 90 31 112 31C136 31 150 12 174 12C194 12 200 20 214 20C224 20 230 5 238 5" fill="none" stroke="#fff" stroke-opacity=".13" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="ldFill" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" d="M2 38C22 38 40 22 62 22C84 22 90 31 112 31C136 31 150 12 174 12C194 12 200 20 214 20C224 20 230 5 238 5" fill="none" stroke="url(#ld-g)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity="0"/>
    <g id="ldHead"><circle r="13" fill="url(#ld-head)"/><circle r="3.2" fill="#fff6dc"/></g>
  </svg>
  <div class="msg" id="msg">正在启动本地后端</div>
</div>
<div class="err" id="err">
  <b>后端没有启动成功</b>（等了 <span id="waited">90</span> 秒）。可以这样排查：<br>
  1. 新电脑第一次用：先双击软件目录里的「<b>安装.bat</b>」安装运行所需的组件（只需要一次），装完再打开；<br>
  2. 打开软件目录里的 <code>data\server.log</code>，看最后几行的报错（缺组件时会写明缺哪个、怎么装）；<br>
  3. 在软件目录打开命令行，运行 <code>python -m server.main</code>，看具体提示；<br>
  4. 端口问题：任务管理器结束所有 Python，再双击「顺势」；日志里有 <code>WinError 10013</code> 的话，见使用手册「安装时的常见问题」。
  <div class="row"><button id="retry">再等一会</button><button class="ghost" id="openanyway">直接打开</button></div>
</div>

<script>
(() => {
  const qs = new URLSearchParams(location.search);
  const APP = (qs.get('url') || 'http://127.0.0.1:8000/').replace(/\/?$/, '/');
  const ALT = (qs.get('alt') || '').split(',').map(x => x.trim()).filter(Boolean)
    .map(x => (/^\d+$/.test(x) ? `http://127.0.0.1:${x}/` : x.replace(/\/?$/, '/')));
  const CANDS = [APP, ...ALT.filter(u => u !== APP)];
  let TARGET = APP;
  const END = 2.4;                    // 开场一共这么多秒（后端早就在运行时也让它播完，再跳走）
  const TIMEOUT = 90000;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const t0 = performance.now();
  const $ = id => document.getElementById(id);
  const msg = $('msg');
  let ready = false, done = false;

  // ================= 开场：按时间逐帧画 =================
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const lerp = (a, b, k) => a + (b - a) * k;
  const eo3 = x => 1 - Math.pow(1 - x, 3);
  const eio2 = x => (x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);

  const logo = $('logo'), trend = $('trend'), glow = $('glow'), pulse = $('pulse'), ghost = $('ghost'), head = $('head'),
        title = $('title'), sub = $('sub'), boot = $('boot');
  const L = trend.getTotalLength();
  const setHead = (p, extra = 1) => {
    const pt = trend.getPointAtLength(clamp(p) * L);
    head.setAttribute('transform', `translate(${pt.x.toFixed(1)} ${pt.y.toFixed(1)}) scale(${extra.toFixed(3)})`);
  };

  function render(t) {
    // 1) 底板浮现
    const tile = eo3(seg(t, 0, .7));
    logo.style.opacity = String(tile); logo.style.transform = `scale(${(.95 + .05 * tile).toFixed(4)})`;
    // 2) 一束光把波段线画出来
    const p = eio2(seg(t, .4, 1.5));
    trend.style.strokeDashoffset = glow.style.strokeDashoffset = String(1 - p);
    ghost.style.opacity = String(eo3(seg(t, .7, 1.5)));
    head.style.opacity = String(seg(t, .4, .6));
    const pop = seg(t, 1.5, 2.0);                                         // 到达终点：光点弹一下
    setHead(p, lerp(1.7, 1, eo3(seg(t, 1.35, 1.9))) + .28 * Math.sin(pop * Math.PI) * (1 - pop));       // 画线时光点大一些、醒目；到终点后收回原大小
    // 3) 名字、副标题淡入
    const w = eo3(seg(t, 1.2, 1.9)); title.style.opacity = String(w); title.style.transform = `translateY(${((1 - w) * 8).toFixed(2)}px)`;
    const s = eo3(seg(t, 1.5, 2.1)); sub.style.opacity = String(s); sub.style.transform = `translateY(${((1 - s) * 6).toFixed(2)}px)`;
    // 4) 加载区浮现
    boot.style.opacity = String(seg(t, 1.7, 2.3));
  }

  // ================= 加载线：光点沿着波段线往前走 =================
  const ldFill = $('ldFill'), ldHead = $('ldHead'), LL = ldFill.getTotalLength();
  let target = .05, disp = 0, popAt = 0;
  function drawLoader(now) {
    disp += (target - disp) * .08;
    const p = clamp(disp);
    ldFill.style.strokeDashoffset = String(1 - p); ldFill.style.opacity = p > .006 ? '1' : '0';
    const pt = ldFill.getPointAtLength(p * LL);
    const breathe = 1 + .12 * Math.sin(now / 260) + (popAt ? .5 * Math.max(0, 1 - (now - popAt) / 500) : 0);        // 光点呼吸；走到终点时弹一下
    ldHead.setAttribute('transform', `translate(${pt.x.toFixed(1)} ${pt.y.toFixed(1)}) scale(${breathe.toFixed(3)})`);
  }

  // ================= 启动流程 =================
  const tickTimer = setInterval(() => {                  // 等待时光点缓慢逼近 84%（只是估计）；文字写出已等的秒数，让人知道没卡住
    if (ready) return;
    target += (.84 - target) * .035;
    const s = Math.round((performance.now() - t0) / 1000);
    msg.innerHTML = s < 4 ? '正在启动本地后端' : `正在启动本地后端 · <em>${s}</em> 秒（首次约 5~15 秒）`;
  }, 200);
  function probe(base) {                                 // 本页是本地文件，读不到后端的响应内容：用后端的 favicon.svg 当图片加载，加载成功 = 本软件已就绪
    return new Promise(res => {
      const img = new Image();
      const to = setTimeout(() => { img.onload = img.onerror = null; res(false); }, 1500);
      img.onload = () => { clearTimeout(to); res(true); };
      img.onerror = () => { clearTimeout(to); res(false); };
      img.src = base + 'favicon.svg?t=' + Date.now();
    });
  }
  async function ping() {
    const ok = await Promise.all(CANDS.map(probe));
    const k = ok.indexOf(true);
    if (k >= 0) { TARGET = CANDS[k]; return true; }
    return false;
  }
  let deadline = t0 + TIMEOUT;
  async function loop() {
    while (!ready) {
      if (await ping()) { ready = true; break; }
      if (performance.now() > deadline) { fail(); return; }
      await new Promise(r => setTimeout(r, 500));
    }
    target = .92; msg.textContent = '已连接，正在载入行情与界面';                                        // 后端真的连上了
    await new Promise(r => setTimeout(r, 500));
    target = 1; msg.textContent = '准备就绪';
    for (let i = 0; i < 40 && disp < .985; i++) await new Promise(r => setTimeout(r, 50));             // 等光点走到终点
    popAt = performance.now();
    const wait = Math.max(0, END * 1000 - (performance.now() - t0));
    setTimeout(go, reduce ? 0 : wait + 380);
  }
  function go() {
    if (done) return; done = true;
    clearInterval(tickTimer);
    document.body.classList.add('leaving');             // 只收起加载区；图标和名字原地不动，index.html 的 #boot 接着显示同样的画面
    setTimeout(() => location.replace(TARGET + '?splash=1'), reduce ? 0 : 260);
  }
  function fail() {
    clearInterval(tickTimer);
    boot.style.display = 'none';
    $('waited').textContent = Math.round((performance.now() - t0) / 1000);
    $('err').style.display = 'block';
  }
  $('retry').onclick = () => { $('err').style.display = 'none'; boot.style.display = ''; deadline = performance.now() + 60000; ready = false; loop(); };
  $('openanyway').onclick = () => location.replace(TARGET);
  addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ' || e.key === 'Escape') && ready) go(); });     // 后端就绪后，按 Enter / 空格直接进入

  if (qs.has('freeze')) {                                // 调试：只画某一刻的静止画面
    render(parseFloat(qs.get('freeze')) || 0); clearInterval(tickTimer);
    target = .55; disp = .55; drawLoader(0); msg.innerHTML = '正在启动本地后端 · <em>7</em> 秒（首次约 5~15 秒）';
    return;
  }
  if (reduce) { render(END); target = disp = .3; drawLoader(0); }
  else {
    const play = now => {
      const t = (now - t0) / 1000;
      render(Math.min(t, END));
      if (t > END) {                                      // 开场播完后还在等后端：一束光每隔几秒沿着图标里的波段线扫过，画面不是死的
        const ph = (t - END) % 3.6, q = seg(ph, 2.0, 3.2), sp = lerp(-.14, 1, eio2(q));
        pulse.style.strokeDashoffset = String(-sp); pulse.style.opacity = String(q > 0 && q < 1 ? Math.sin(q * Math.PI) : 0);
        setHead(1, 1 + .06 * Math.sin(t * 2.4));
      }
      drawLoader(now);
      requestAnimationFrame(play);
    };
    requestAnimationFrame(play);
  }
  loop();
})();
</script>
</body>
</html>
