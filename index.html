<!DOCTYPE html>
<html lang="zh-CN" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">          <!-- 中文软件，不需要浏览器的「要不要翻译」提示 -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>顺势 · 趋势波段</title>
<meta name="theme-color" content="#f2f4f8">
<meta name="author" content="林上升 &lt;linshangsheng1987@gmail.com&gt;">
<meta name="description" content="顺势：A 股 + 美股的宽基择时、低风险组合与波段工具（个人研究，本地运行）。作者 林上升">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
<style>
/* 从启动画面（splash.html）跳过来时：先盖一层与启动画面最后一帧完全一样的画面（图标 144px、名字、英文副标题、同样的底色 / 氛围光 / 阴影 / 位置），首屏渲染好再淡出，不会闪、也看不出换了页面 */
#boot { position: fixed; inset: 0; z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 26px; --icon: 144px;
  background: radial-gradient(900px 600px at 50% 38%, #1a1d33 0%, #0d0f1d 55%, #07080f 100%); transition: opacity .6s ease; }
#boot::before { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(700px 420px at 80% 94%, rgba(255,160,60,.07), transparent 70%), radial-gradient(600px 400px at 10% 6%, rgba(90,110,255,.06), transparent 70%); }
html.splash #boot { display: flex; }
#boot img { position: relative; width: var(--icon); height: var(--icon); border-radius: calc(var(--icon) * .2266); box-shadow: 0 18px 44px rgba(0,0,0,.5), 0 0 60px rgba(255,177,59,.10); }
#boot .word { position: relative; height: 56px; text-align: center; font-family: "SF Pro Display", "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui, sans-serif; }
#boot b { display: block; height: 34px; line-height: 34px; font-size: 26px; font-weight: 500; letter-spacing: .34em; padding-left: .34em; color: #f1eee6; }
#boot small { display: block; margin-top: 8px; height: 14px; line-height: 14px; font-size: 10.5px; letter-spacing: .5em; padding-left: .5em; color: #7d84a8; }
#boot.hide { opacity: 0; pointer-events: none; }
@media (max-width: 640px) { #boot { --icon: 112px; } #boot b { font-size: 22px; } }
</style>
<script>
if (/[?&]splash=1/.test(location.search)) {
  document.documentElement.classList.add('splash');
  setTimeout(function () { var b = document.getElementById('boot'); if (b) b.classList.add('hide'); }, 6000);   // 兜底：脚本出错也不会一直挡着
}
</script>
</head>
<body>
<div id="boot" aria-hidden="true"><img src="icon.svg" alt=""><div class="word"><b>顺势</b><small>TREND · SWING</small></div></div>
<div id="app" class="app" data-view="screener">
  <nav class="nav" id="nav" aria-label="主导航">
    <div class="brand" title="顺势 · 作者 林上升（点这里看「关于」）" role="button" tabindex="0">
      <img src="favicon.svg" width="24" height="24" alt="" aria-hidden="true">
      <span>顺势</span>
    </div>
    <div class="market-switch" role="tablist" aria-label="市场">
      <button data-market="CN" class="on" role="tab">A股</button>
      <button data-market="US" role="tab">美股</button>
    </div>
    <a href="#/kline" data-nav="kline"><i data-ico="candle"></i><span>K线</span></a>
    <a href="#/screener" data-nav="screener"><i data-ico="radar"></i><span>选股</span></a>
    <a href="#/watchlist" data-nav="watchlist"><i data-ico="star"></i><span>自选股</span></a>
    <a href="#/portfolio" data-nav="portfolio"><i data-ico="wallet"></i><span>持仓</span></a>
    <a href="#/market" data-nav="market"><i data-ico="chart"></i><span>行情</span></a>
    <a href="#/news" data-nav="news"><i data-ico="news"></i><span>资讯</span></a>
    <a href="#/backtest" data-nav="backtest"><i data-ico="flask"></i><span>回测</span></a>
    <a href="#/settings" data-nav="settings"><i data-ico="gear"></i><span>设置</span></a>
    <div class="nav-foot">
      <span class="badge demo" id="demo-badge" hidden title="当前使用合成演示数据，不代表真实行情">演示数据</span>
      <button class="icon-btn" id="reload-btn" title="刷新页面（软件更新后点这里，不用 Ctrl+F5）" aria-label="刷新页面">↻</button>
      <button class="icon-btn" id="fs-btn" title="全屏" aria-label="切换全屏">⛶</button>
      <button class="icon-btn" id="theme-btn" title="切换深色 / 浅色" aria-label="切换主题">◐</button>
    </div>
  </nav>

  <main class="main" id="main">
    <section class="col-list" id="col-list"></section>
    <section class="col-detail" id="col-detail"></section>
    <section class="col-page" id="col-page"></section>
  </main>
</div>
<div id="toast-root" aria-live="polite"></div>
<div id="modal-root"></div>

<script src="vendor/lightweight-charts.standalone.production.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
