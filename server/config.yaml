# 股票 App 集中配置（限频 / 过滤阈值 / 策略参数 / 费用与滑点）
# 对应需求书：3.25.1 / 3.26.1 / 3.26.3 / 5.4 / 5.4.1 / 5.5.1 / 5.8 / 3.26.6
# 所有数值均为「初始假设」，需经 M1 剔除统计与 M2 因子检验后校准（附录 B）。

server:
  host: 127.0.0.1          # 默认只监听本机；改成 0.0.0.0 开放局域网时必须设置 token（1.6）
  port: 8000
  token: ""                # 局域网访问口令；host 非 127.0.0.1 且 token 为空时拒绝启动
  ssl_certfile: ""         # 本地 HTTPS（可选）：证书与私钥路径；见 tools/make_cert.py 与 docs/使用手册.md
  ssl_keyfile: ""

data_dir: data
history_years: 10          # 3.26 历史深度（含 200 日均线预热期）

# 初始化范围：默认全部拉取；也可只随机拉 N 只（试用 / 省流量 / 省时间）。抽样结果会保存，中断续跑与再次点击沿用同一批股票。
init:
  sample_size: 0           # 0 = 全部；>0 = 随机抽取这么多只（例如 100）
  us_threads: 3            # 美股批量下载的并发线程数（1 = 串行）；遇到限流自动降为 1。想更稳就设 1


# 数据源：cn 可选 baostock | demo（demo 为合成数据，仅用于离线演示与界面验证，写入 data/demo/）
datasource:
  cn: baostock
  us: yfinance                       # yfinance | demo

# 3.26.3 反爬 / 防封 IP：随机延迟 + 指数退避 + 熔断（单位：秒）
throttle:
  baostock: {min_delay: 0.1, max_delay: 0.4, backoff_base: 10, backoff_max: 80, breaker_failures: 3, breaker_pause: 600}
  akshare:  {min_delay: 1.5, max_delay: 3.0, backoff_base: 10, backoff_max: 80, breaker_failures: 3, breaker_pause: 600}
  yfinance: {min_delay: 2.0, max_delay: 5.0, backoff_base: 10, backoff_max: 80, breaker_failures: 3, breaker_pause: 600}
  eastmoney: {min_delay: 2.0, max_delay: 4.0, backoff_base: 20, backoff_max: 120, breaker_failures: 3, breaker_pause: 1800}   # 东财行情 / 数据中心：有 IP 级限流（M0 实测：连续密集请求后被断开），宁可慢
  cninfo:   {min_delay: 1.0, max_delay: 2.5, backoff_base: 10, backoff_max: 80, breaker_failures: 3, breaker_pause: 600}
  sec:      {min_delay: 0.25, max_delay: 0.6, backoff_base: 10, backoff_max: 80, breaker_failures: 3, breaker_pause: 600}   # SEC 要求 ≤ 10 次/秒

# 3.26.1 股票池分层（CN）
universe:
  cn:
    boards: [main, chinext, star]   # 北交所默认不纳入（B.2-1）；科创板默认纳入（B.2-2）
    l1:
      min_list_days: 120            # 交易日
      min_price: 2.0                # 入库时快照粗筛（元）
      min_float_mktcap: 3000000000       # 流通市值，入库时快照粗筛（元）
      min_avg_amount20: 50000000       # 20 日日均成交额（元）
    l2:
      min_list_days: 250
      min_price: 3.0                # 不复权收盘价，逐日
      min_avg_amount20: 100000000       # 逐日
      max_suspend_60d: 3            # 近 60 日停牌天数上限
      max_oneword_20d: 2            # 近 20 日一字涨/跌停天数上限
      exclude_st: true              # 当日 ST / *ST 剔除（点时）
  us:
    # 证券类型（普通股，剔除 ETF / 优先股 / 权证 / 单位 / 权利 / SPAC / 测试标的）在名单阶段处理，见 datasource_us.py
    l1:
      min_list_days: 120
      min_price: 3.0                # 入库预筛（近 45 日日线；yfinance 无全市场快照）
      min_float_mktcap: 500000000   # 市值：无快照时不筛（L2 的成交额门槛已间接约束小市值）
      min_avg_amount20: 10000000    # $1,000 万
    l2:
      min_list_days: 250
      min_price: 5.0                # 还原后的「当时真实价」（拆股调整价 × 之后所有拆股的累计比例，3.6.1），逐日
      min_avg_amount20: 20000000    # $2,000 万，逐日
      max_suspend_60d: 3            # 近 60 日缺失交易日（长期暂停交易）上限
      max_oneword_20d: 99           # 美股无涨跌停：该项不起作用
      exclude_st: false

# 3.25.1 数据完整性闸门
gate:
  min_coverage: 0.98
  max_anomaly_ratio: 0.01
  volume_drift_range: [0.2, 5.0]    # 全池成交量/成交额中位数与前 20 日中位数之比的合理区间
  snapshot_recon_tol: 0.005
  benchmark_symbols_cn: ["sh.000300", "sh.000001", "sz.399001", "sz.399006", "sh.000905", "sh.000852"]
  benchmark_symbols_us: ["SPY", "QQQ", "IWM", "DIA", "^GSPC", "^IXIC", "^VIX"]
  sector_etfs_us: ["XLK", "XLF", "XLV", "XLY", "XLP", "XLE", "XLI", "XLU", "XLB", "XLRE", "XLC"]   # 行业 ETF：辅助基准 / 校验（3.14），不参与完整性闸门

# 市场温度与指数 / ETF 择时（market_view.py）。默认值按 A 股 2016~2026 日线校准：前 60% 样本内选参、后 40% 样本外检验
market_view:
  zones: [0.15, 0.35, 0.65, 0.80]   # 全A站上 20 日线比例的分界：冰点 / 偏冷 / 中性 / 偏热 / 过热
  evidence_index_cn: "sh.000300"
  evidence_index_us: "SPY"
  index_rule:
    cost_per_side: 0.0005           # ETF 单边成本（佣金 + 滑点），ETF 免印花税
    trend:   {weight: 0.5, ma: 20, band: 0.02, top_k: 2, mom_days: 20}
             # 趋势仓：收盘 > MA20×1.02 买、< MA20×0.98 卖；且只做近 20 日涨幅排前 2 的指数（掉出前 2 也卖）。
             # 轮动依据（5 个宽基组合）：样本内 Sharpe 0.40→0.57、回撤 -15.5%→-12.8%；样本外 0.71→0.79、-13.7%→-11.0%（年化 6.9%→5.9%）。
             # 同时检验过「按波动率减仓」「按 1/ATR 分配资金」：样本内都更差，不采用。top_k: 0 = 关闭轮动
             # 参数敏感度（一次动一个参数）：MA 15~30、band 1%~3%、top_k 1~3、抄底阈值 12%~18%、止盈宽度 75%~85%、持有 30~50 天、
             # 止损 2.5~3.5 ATR，样本外 Sharpe 都在 0.68~0.92（持有 0.31）——是「平台」不是尖峰，故不再微调
    washout: {weight: 0.5, enter_below: 0.15, exit_above: 0.80, max_hold_days: 40, stop_atr_k: 3.0, atr_n: 20,     # 抄底仓
              take_profit_pct: 0, take_profit_atr: 0, ref_take_profit: [0.05, 0.10]}
              # 固定止盈默认不设：回测里 +5% / +8% / +10% / +3ATR / +5ATR 的样本内 Sharpe 都低于不止盈（恐慌后的反弹常走得更远）。
              # ref_take_profit 只作「想落袋为安」的参考位显示，不进规则
  indices_cn:
    - {symbol: sh.000016, name: 上证50,   style: 超大盘蓝筹, etf: "510050 上证50ETF"}
    - {symbol: sh.000300, name: 沪深300,  style: 大盘,       etf: "510300 / 159919 沪深300ETF"}
    - {symbol: sh.000905, name: 中证500,  style: 中盘,       etf: "510500 中证500ETF"}
    - {symbol: sh.000852, name: 中证1000, style: 小盘,       etf: "512100 中证1000ETF"}
    - {symbol: sz.399006, name: 创业板指, style: 成长,       etf: "159915 创业板ETF"}
  indices_us:
    - {symbol: SPY, name: 标普500,     style: 大盘,     etf: SPY}
    - {symbol: QQQ, name: 纳斯达克100, style: 科技成长, etf: QQQ}
    - {symbol: IWM, name: 罗素2000,    style: 小盘,     etf: IWM}
    - {symbol: DIA, name: 道琼斯,      style: 蓝筹,     etf: DIA}

# 3.6.1 / 3.13.1 口径
features:
  min_valid_ratio: 0.9              # 滚动窗口内有效交易日占比下限（停牌日不填充，不足输出缺失）
  rps_min_sample: 300               # RPS 当日有效样本数下限
  high_52w_days: 252
  atr_period: 14

# 4.4.1 / 5.4 市场环境闸门（候选规则，参数待回测）
regime:
  benchmark: "sh.000300"            # A 股默认沪深 300；美股见 markets.US（SPY）
  vix_caution: 0                    # 美股：VIX 高于此值时 NORMAL 降为 CAUTION（0 = 不启用；候选规则，参数待回测）
  ma_mid: 50
  ma_long: 200
  breadth_ma: 50                    # 宽度 = 站上 MA50 的股票比例
  breadth_normal: 0.45              # 宽度高于此值且指数在 MA50 之上 -> 正常
  breadth_defensive: 0.25           # 指数跌破 MA200 且宽度低于此值 -> 防守

# 5.4 漏斗各层的硬 / 软约束
funnel:
  l1_l2: {hard: true}
  regime_gate: {hard: true}
  industry_strength: {hard: false, weight: 1.0}
  rps: {hard: false, weight: 1.0, min_rps: 0}
  setup: {hard: true}
  risk_exclusion: {hard: true, earnings_window_days: 3, projection_margin_days: 3}   # 预计披露日有不确定性：proj / deadline 额外放宽的交易日数
  top_n: 15
  cooldown_days: 5                  # 5.4.1 同标的信号冷却期
  score_method: lowrisk             # 候选排序：lowrisk = 低换手 + 低波动优先（检验支持）；momentum = 旧的 RPS + 行业强弱（检验为负，仅作对照）

# 5.4.1 形态规格（默认值；搜索范围见需求书，仅回测网格使用）
setups:
  # 默认只启用「波动收缩突破」：A 股 2018~2026 抽样回测（3 组各 1200 只随机样本，样本内 2018~2022 / 样本外 2023~）中，
  # 它是唯一在全部 6 次检验里期望值都为正的形态（但幅度小、未达统计显著）；「突破」「回踩」显著差于同日随机入场（追涨在 A 股是负优势），
  # 「强势超跌」在完整成交规则下样本外为负。可在此手动加回：[vcp, breakout, pullback, oversold]。复现：python tools/calibrate.py
  enabled: [vcp]
  breakout:
    n: 20
    vol_ratio_min: 1.5
    close_pos_min: 0.7
    ext_atr_min: 0.1
    ext_atr_max: 2.0
  pullback:
    rps60_min: 80
    depth_atr_min: -0.5
    depth_atr_max: 1.0
    vol_ratio_max: 0.8
    close_pos_min: 0.6
  vcp:
    atr_ratio_max: 0.8
    bb_pct_max: 0.20
    range10_atr_max: 4.0
    vol_ratio_min: 1.3
    close_pos_min: 0.7
    high52_dist_max: 0.25
  oversold:                         # 强势超跌（短期反转）
    rps60_min: 70
    rsi_max: 35

# 6.6.1 / 6.6.2 检验通过标准（默认值，附录 B.2-6；偏保守，可按需调整）
# 只有通过检验的因子才进入买入条件 / 综合打分；未通过的形态保持「仅标注、不进入综合打分」。
validation:
  factor:            # 单因子：在 horizons 中至少 min_horizons_pass 个周期同时满足
    min_abs_ic: 0.02          # |Rank IC 均值|
    min_ic_ir: 0.30           # |IC 均值 / IC 标准差|
    min_t_eff: 2.0            # 按前瞻窗口重叠折算有效样本后的 t 值
    min_abs_monotonic: 0.8    # 分层收益的单调性（Spearman，1 = 严格单调）
    min_horizons_pass: 2
  event:             # 形态事件研究
    min_independent_days: 50  # 独立信号日下限（低于则不下结论）
    max_p: 0.05               # 相对随机入场基线的 p 值
    min_mean_r: 0.0           # 按信号日聚合的期望 R 须为正
    ci_lower_gt_zero: true    # block bootstrap 95% 置信区间下限须 > 0
    min_positive_year_ratio: 0.6   # 样本量 ≥ min_year_n 的年份里，期望 R 为正的比例
    min_year_n: 10

# 5.5.1 日线成交规则
execution:
  entry_mode: next_open             # next_open | stop_entry
  stop_entry_valid_days: 1
  max_gap_atr: 0                    # 次日开盘买：开盘价高于「信号日收盘 + k×ATR14」就放弃（不追高开）；0 = 不限
  resize_on_fill: true              # 按实际开盘价重算股数（只减不加），让单笔最大亏损不超过计划。
                                    # 抽样回测（3 组）：样本内回撤 3 组都变小、收益基本不变；「高开就放弃」（max_gap_atr）无稳定好处，默认关闭
  slippage: 0.001                   # 0.1%，不利方向
  max_adv_pct: 0.01                 # 单笔成交额 ≤ 信号日 20 日均成交额 × 1%
  lot_size: 100                     # A 股整手；科创板 200 股起、之后 1 股递增（见 backtest.lot_rules）

# 5.7 / 5.6 止损止盈
exits:
  stop_atr_k: 2.0                   # 初始止损 = 入场价 - k × ATR14
  trail: atr                        # atr | ma10 | none
  trail_atr_k: 3.0                  # 跟踪止损 = 持仓以来最高收盘 - k × ATR14（T 日收盘后更新，T+1 生效）
  max_hold_days: 20                 # 时间退出：持满 N 个交易日后第 N+1 日开盘卖出
  exit_below_ma: 20                 # 收盘跌破 MA20：T+1 开盘卖出（0 关闭）
  hard_stop_pct: 0.10               # 硬止损：相对入场价单笔最大亏损上限
  stop_mode: atr                    # 初始止损：atr（入场价 - k×ATR）| structure（形态低点，5.4.1 对照）
  take_profit_pct: 0.10             # 短期止盈：买入后盘中涨到「买入价 × 1.10」就全部卖出（挂条件单）；没到则照旧用移动止损。0 = 关闭
                                    # 抽样回测（3 组 × 1200 只）：在 7 种止盈方式里样本内 Sharpe 最高，样本外 3 组都优于「只用移动止损」、回撤更小
  take_profit_r: 0                  # 固定目标位（以初始风险 R 计，如 2.0）；0 = 关闭
  partial_r: 0                      # 分批止盈：浮盈达到多少 R 时卖出一部分；0 = 关闭
  partial_fraction: 0.5             # 分批止盈卖出比例
  partial_move_stop_be: true        # 分批止盈后把止损上移到成本价

# 关键均线（server/key_ma.py；证据：tools/ma_research.py → server/key_ma_evidence.json）：行情页「关键均线」面板。
# 每条均线（20 / 60 / 120 / 200 / 250 日）单独检验：两段（样本内 / 样本外）都 Sharpe ≥ 一直持有、最大回撤浅 10 个百分点以上才算「可操作」。
# 标普500 主线 200 日、纳指100 主线 200 日、创业板指主线 20 日 ±2%（= ETF 规则趋势仓）。不给杠杆建议。
key_ma:
  refresh_hours: 3                  # 美股指数多久从 yfinance 更新一次（失败用缓存）
  indices:
    - {key: cyb, name: 创业板指,    market: CN, symbol: sz.399006, etf: "159915 创业板ETF"}
    - {key: spx, name: 标普500,     market: US, symbol: "^GSPC",   etf: "513500 标普500ETF（QDII，A 股账户可买，注意溢价）"}
    - {key: ndx, name: 纳斯达克100, market: US, symbol: "^NDX",    etf: "513100 / 159941 纳指ETF（QDII，A 股账户可买，注意溢价）"}

# 低风险多因子组合（server/factor_portfolio.py；验证见 tools/factor_research.py 与 CHANGELOG v0.7.0）：
# 定期调仓、等金额持有「低换手 + 低波动」综合分前 N 名；不用止损止盈，调仓日按名单买卖。
#   全市场回测（5133 只，2018~2026，事先写好 8 个方案，2018~2022 选、2023~ 验）：样本内年化约 0~+1%（同期交易池等权 -5%），
#   最大回撤约 -22%（等权 -43%）；样本外年化 +16~+21%、回撤约 -10%。打分推迟一天结果不变（无未来函数），随机打分≈等权（引擎无偏）。
#   「再加短期反转」：换手 17~30 倍、样本内更差，否决。按真实资金（4~5 万）重选：10 / 20 只、每 10 / 20 天四种差别在噪音内，
#   取手续费最低、最好操作的 10 只、每 20 个交易日（约一个月）。
factor_portfolio:
  score: lowrisk                    # lowrisk = 低换手 + 低波动；lowrisk_rev = 再加「近 20 日跌得多」（已否决，仅作对照）
  n: 10                             # 持有只数（组合资金 20 万以上可改 20，分散更好）
  rebalance_days: 20                # 每几个交易日调仓一次
  buffer: 2.0                       # 已持有的股票只要仍在前 buffer×N 名就不卖（减少换手）
  skip_unaffordable: true           # 一手都买不起的（如 3000 元买不了茅台）跳过、名额让给下一名：样本内完全一样，样本外小资金 +0.3~0.6%/年
  anchor: "2018-01-02"              # 调仓日历起点：从这天起每 rebalance_days 个交易日一次（实盘与回测同一套日历）
  backtest_start: "2018-01-01"      # 选股页「回测证据」的起点
  oos_start: "2023-01-01"           # 样本外起点（之前的数据用来选参数）

# 资金方案（10 万资金，整手与最低佣金 5 元都计入，2018~2026；样本内 2018~2022 / 样本外 2023~）：
#   ETF 70% + 低风险组合 30%：全程年化 5.1% / 最大回撤 -12.5% / Sharpe 0.70（样本内 2.2%，样本外 9.0%、回撤 -6.6%）← 采用
#   ETF 70% + 个股波段 2 只（v0.6 方案）：4.0% / -11.0% / 0.63（样本内 3.7% 更好，样本外 4.5% 差很多）；
#   ETF 50% + 组合 50%：5.6% / -14.1% / 0.69；全部组合：6.6% / -22.9% / 0.57；全部 ETF：4.5% / -12.8% / 0.60。
#   ETF 与组合的日收益相关性 0.35，放在一起能分散。
#   全程 Sharpe 在 ETF 30%~70% 之间几乎一样，取回撤最小的 70% / 30%。把个股波段加进来（1 只或 2 只）在各时段都没有更好，
#   所以默认不给波段分钱（etf + factor 之外剩下的才是波段）；想练手可以把 factor 调小、留一部分给波段。
allocation:
  etf: 0.70                         # 宽基 ETF 规则（5 个宽基等分，每个再分趋势仓 / 抄底仓各一半）
  factor: 0.30                      # 低风险组合（10 万 = 3 万，10 只每只约 3000 元）

# 5.8 仓位与组合约束（个股波段）
portfolio:
  risk_per_trade: 0.0075            # 单笔风险（净值比例）：碰到止损时最多亏总资金的 0.75%（10 万 = 750 元）；账户表中可覆盖
  max_positions: 2                  # 个股最多同时持有几只（10 万资金：个股约占 3 万）
  max_per_industry: 3
  max_total_risk: 0.015             # 个股组合总风险上限 = 2 只 × 0.75%
  caution_position_factor: 0.5      # 谨慎状态：仓位上限减半
  initial_equity: 1000000
  sizing: risk                      # 仓位方式（5.8）：risk 风险预算（推荐）| equal 等权 | fixed_pct 固定比例 | vol_inverse 波动率反比
  fixed_pct: 0.10                   # fixed_pct：单只占净值比例
  vol_ref_atr_pct: 0.03             # vol_inverse：参考 ATR%（ATR% 越高仓位越小）

# 5.5.1-4 费用。2026-10 核对现行规则：印花税 0.05%（仅卖出，2023-08-28 起）；过户费 0.001%（双向，2022-04-29 起）；
# 经手费 + 证管费（合计约 0.0341‰）通常已含在券商佣金内。佣金按市场常见的万 2.5（最低 5 元）保守设定——你的券商更低请自行下调。
costs:
  cn:
    commission_rate: 0.00025        # 双向
    commission_min: 5.0
    stamp_duty_sell: 0.0005         # 卖出，按现行规则核实
    transfer_fee: 0.00001           # 双向，按现行规则核实
  us:
    commission_per_share: 0.0
    sec_fee_sell: 0.0000278         # SEC 规费（卖出，按成交额；费率每年调整，以 SEC 公布为准）
    finra_taf_per_share: 0.000166   # FINRA TAF（卖出，按股数，单笔封顶 8.3 美元）
    finra_taf_cap: 8.30

# A 股涨跌幅规则表（带生效日期；按现行规则核实后维护，5.5.1 / 6.4）
limit_rules:
  main:    [{from: "1996-12-16", pct: 0.10}]
  chinext: [{from: "2009-10-30", pct: 0.10}, {from: "2020-08-24", pct: 0.20}]
  star:    [{from: "2019-07-22", pct: 0.20}]
  st_main: [{from: "1996-12-16", pct: 0.05}]   # 主板 ST；如规则变更请追加生效日期
  st_other: [{from: "2020-08-24", pct: 0.20}]  # 创业板 / 科创板 ST 与普通股一致

# 3.26.5 盘后调度
events:
  cache_hours: 6                    # 3.17：新闻 / 公告 / Insider 缓存时长
  max_symbols_per_run: 40           # 盘后任务链每次最多为多少只「候选 + 持仓」拉取事件

jobs:
  poll_interval_minutes: 10         # 运行期间检查缺失交易日 / 探测当日数据是否可用的间隔
  probe_start_minutes: 20           # 收盘后多久开始探测当日数据（探测只查 1 个基准指数，很便宜）
  data_ready_after_close_minutes: 90  # 无观测数据时的保守默认（探测失败时用于提示「超过预期仍未就绪」）
  scan_on_startup: true
  prewarm: true                 # 启动后后台预热市场温度与全市场面板（约 40 秒、2 GB 内存），打开页面不用等

# 3.26.6 备份（相对路径相对于数据目录 data/）
# dir：每日备份（个人库 + 扫描 / 回测记录等不可重建数据，体积小）——建议放网盘同步目录；
#      用户机器上请在 data/user_config.yaml 里写绝对路径（见 README）。
# full_dir：行情库全量备份（每周一份、只留 3 份，体积大）——默认留在本机。
backup:
  dir: backups
  full_dir: backups_full
  keep_daily: 14
  keep_monthly: 12
  keep_full: 1                      # 行情库全量备份（gzip 压缩，约原大小的 1/3）只留最近几份；行情可重新下载，留 1 份足够应急

# 2.1 / 6.6：A股、美股参数各自独立——此处是对基础配置的覆盖层（美股参数需独立验证，不沿用 A 股参数）
markets:
  US:
    regime: {benchmark: "SPY"}
    execution: {slippage: 0.0005, lot_size: 1}     # 美股流动性好：滑点初始 0.05%；整股（可改零股）
    portfolio: {initial_equity: 100000}
    jobs: {data_ready_after_close_minutes: 30}
    features: {rps_min_sample: 300}
